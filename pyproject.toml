[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-benchmark"
version = "0.1.0"
description = "RAG retrieval benchmarking system: Strategy A vs Strategy B vs Hybrid"
requires-python = ">=3.10"
dependencies = [
    # Local gecko simulation: 768-dim multilingual mpnet via sentence-transformers
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
rag-benchmark = "benchmark.runner:run"

[tool.setuptools.packages.find]
include = [
    "core*",
    "embeddings*",
    "vector_store*",
    "retrieval*",
    "expansion*",
    "mocks*",
    "benchmark*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
